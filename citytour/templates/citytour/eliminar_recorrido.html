{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Eliminar Recorrido</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container mt-5">
    <div class="card p-4 shadow">
      <h3 class="text-center text-danger mb-4">Eliminar Recorrido</h3>
      <p class="text-center">
        ¿Estás seguro de que querés eliminar el recorrido
        <strong>{{ recorrido.nombre }}</strong>?
      </p>
      <form method="post" class="text-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'recorridos' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </body>
</html>
