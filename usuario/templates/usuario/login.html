{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="d-flex flex-column min-vh-100 bg-light">
    <header>
      <h1 class="text-center text-danger my-3">CITYTUR CATAMARCA</h1>
    </header>

    <main class="container my-5 flex-grow-1">
      <section class="card shadow p-4 mx-auto" style="max-width: 500px">
        <h2 class="text-center mb-3">Iniciar Sesión</h2>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="contraseña" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contraseña"
              name="contraseña"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary w-100">
              Ingresar
            </button>
          </div>
        </form>

        <p class="text-center mt-3">
          ¿No tenés una cuenta?
          <a href="{% url 'registro' %}" class="text-decoration-none">
            Registrate acá
          </a>
        </p>
      </section>
    </main>

    <footer class="text-center p-3 bg-dark text-white mt-auto">
      Sitio Oficial de CITYTUR CATAMARCA - 2025
    </footer>
  </body>
</html>
