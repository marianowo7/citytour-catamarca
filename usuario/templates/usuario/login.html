{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Iniciar sesión - CityTour Catamarca</title>
  </head>

  <body style="background-color: #f8f9fa;">
    <div class="container my-5">
      <div class="card shadow mx-auto" style="max-width: 600px; border-radius: 12px;">
        <div class="card-header bg-dark text-white text-center">
          <h2 class="my-2">CITYTUR CATAMARCA</h2>
        </div>

        <div class="card-body p-4">
          <h4 class="text-center mb-4 text-primary">Iniciar sesión</h4>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">{{ form.as_p }}</div>
            <div class="text-center">
              <button type="submit" class="btn btn-success w-100 py-2">
                Ingresar
              </button>
            </div>
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="text-decoration-none">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <p class="text-center mt-3">
            ¿No tenés una cuenta?
            <a href="{% url 'registro' %}" class="text-decoration-none text-primary fw-semibold">
              Registrate acá
            </a>
          </p>
        </div>

        <div class="card-footer bg-dark text-center text-white small">
          © 2025 CityTour Catamarca
        </div>
      </div>
    </div>
  </body>
</html>
