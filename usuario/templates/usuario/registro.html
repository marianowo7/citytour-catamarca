{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="d-flex flex-column min-vh-100 bg-light">
    <header>
      <h1 class="text-center text-danger my-3">CITYTUR CATAMARCA</h1>
    </header>

    <main class="container my-5 flex-grow-1">
      <section class="card shadow p-4 mx-auto" style="max-width: 500px">
        <h2 class="text-center mb-3">Crear una cuenta</h2>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              required
            />
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="dni" class="form-label">DNI</label>
            <input
              type="number"
              class="form-control"
              id="dni"
              name="dni"
              placeholder="Ej: 12345678"
              required
            />
          </div>
          <div class="mb-3">
            <label for="contraseña" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contraseña"
              name="contraseña"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select id="rol" name="rol" class="form-select">
              <option value="TURISTA">Turista</option>
              <option value="OPERADOR">Operador</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-success w-100">
              Registrarme
            </button>
          </div>
        </form>

        <p class="text-center mt-3">
          ¿Ya tenés cuenta?
          <a href="{% url 'login' %}" class="text-decoration-none">
            Iniciá sesión
          </a>
        </p>
      </section>
    </main>

    <footer class="text-center p-3 bg-dark text-white mt-auto">
      Sitio Oficial de CITYTUR CATAMARCA - 2025
    </footer>
  </body>
</html>
